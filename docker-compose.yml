services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-16G}
        reservations:
          memory: ${OLLAMA_MEMORY_RESERVATION:-8G}
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - app-network

  ollama-init:
    image: curlimages/curl:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - app-network
    restart: "no"
    entrypoint: >
      sh -c "
        echo 'Pulling ${OLLAMA_MODEL:-qwen2.5:3b} model...' &&
        curl -sf -X POST http://ollama:11434/api/pull -d '{\"name\": \"${OLLAMA_MODEL:-qwen2.5:3b}\"}' &&
        echo 'Model ready!'
      "

  schema-server:
    build:
      context: ./schema-server
      dockerfile: Dockerfile
    container_name: schema-server
    ports:
      - "127.0.0.1:${SCHEMA_PORT:-7001}:7001"
    volumes:
      - ./data/schemas:/data/schemas:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:7001/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: always
    networks:
      - app-network

  values-server:
    build:
      context: ./values-server
      dockerfile: Dockerfile
    container_name: values-server
    ports:
      # localhost only: PUT here skips the bot's schema validation
      - "127.0.0.1:${VALUES_PORT:-7002}:7002"
    # must be able to write ./data/values; on Linux set APP_UID/APP_GID to `id -u`/`id -g`
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ./data/values:/data/values
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:7002/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: always
    networks:
      - app-network

  bot-server:
    build:
      context: ./bot-server
      dockerfile: Dockerfile
    container_name: bot-server
    ports:
      - "${BOT_PORT:-7000}:7000"
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - SCHEMA_URL=${SCHEMA_URL:-http://schema-server:7001}
      - VALUES_URL=${VALUES_URL:-http://values-server:7002}
    command: >
      python app.py
        --listen=0.0.0.0:7000
        --ollama-url=${OLLAMA_URL:-http://ollama:11434}
        --model=${OLLAMA_MODEL:-qwen2.5:3b}
        --schema-url=${SCHEMA_URL:-http://schema-server:7001}
        --values-url=${VALUES_URL:-http://values-server:7002}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    depends_on:
      ollama:
        condition: service_healthy
      schema-server:
        condition: service_healthy
      values-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:7000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    stop_grace_period: 15s
    networks:
      - app-network

  nginx:
    build:
      context: ./gateway-server
      dockerfile: Dockerfile
    container_name: nginx-gateway
    ports:
      - "80:80"
    depends_on:
      bot-server:
        condition: service_healthy
      schema-server:
        condition: service_healthy
      values-server:
        condition: service_healthy
    restart: always
    profiles:
      - gateway
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring-server/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      schema-server:
        condition: service_healthy
      values-server:
        condition: service_healthy
      bot-server:
        condition: service_healthy
    restart: always
    profiles:
      - monitoring
    networks:
      - app-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring-server/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring-server/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: always
    profiles:
      - monitoring
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  ollama_data:
  prometheus_data:
  grafana_data:
