name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff==0.8.0

      - name: Lint schema-server
        run: ruff check schema-server/

      - name: Lint values-server
        run: ruff check values-server/

      - name: Lint bot-server
        run: ruff check bot-server/

      - name: Lint cli
        run: ruff check cli/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [schema-server, values-server, bot-server, cli]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          pip install -r requirements.txt

      - name: Run tests with coverage and JUnit report
        run: |
          cd ${{ matrix.service }}
          python -m pytest tests/ -v \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/test-results.xml
            ${{ matrix.service }}/coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build

      - name: Verify compose config
        run: docker compose config --quiet

  security-scan:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Build images for scanning
        run: docker compose build

      - name: Get image names
        id: images
        run: |
          SCHEMA_IMG=$(docker compose config --images | grep schema)
          VALUES_IMG=$(docker compose config --images | grep values)
          BOT_IMG=$(docker compose config --images | grep bot)
          echo "schema=$SCHEMA_IMG" >> "$GITHUB_OUTPUT"
          echo "values=$VALUES_IMG" >> "$GITHUB_OUTPUT"
          echo "bot=$BOT_IMG" >> "$GITHUB_OUTPUT"

      - name: Run Trivy scan on schema-server
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.images.outputs.schema }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run Trivy scan on values-server
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.images.outputs.values }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run Trivy scan on bot-server
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.images.outputs.bot }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
