upstream schema_backend {
    server schema-server:7001;
}

upstream values_backend {
    server values-server:7002;
}

upstream bot_backend {
    server bot-server:7000;
}

# Rate limiting zone: 10 requests/second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

    location /health {
        proxy_pass http://bot_backend/health;
        proxy_set_header Host $host;
    }

    location /edits {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass         http://bot_backend/edits;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    location /schemas/ {
        limit_req zone=api_limit burst=20 nodelay;

        rewrite ^/schemas/(.*)$ /$1 break;
        proxy_pass         http://schema_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /values/ {
        limit_req zone=api_limit burst=20 nodelay;

        rewrite ^/values/(.*)$ /$1 break;
        proxy_pass         http://values_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /metrics/schema {
        proxy_pass http://schema_backend/metrics;
    }

    location /metrics/values {
        proxy_pass http://values_backend/metrics;
    }

    location /metrics/bot {
        proxy_pass http://bot_backend/metrics;
    }

    location / {
        return 404 '{"detail": "Not Found"}';
        add_header Content-Type application/json;
    }
}
